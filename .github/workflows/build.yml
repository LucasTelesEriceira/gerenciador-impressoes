name: Build e Release Multiplataforma

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS (.exe)
  # =========================================================================
  build-windows:
    name: Compilar para Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Ícone .ico para Windows
        run: |
          python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Compilar Executável Único com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Gerenciador_Impressoes_Pro" `
            --icon "icon.ico" `
            --add-data "icon.png;." `
            --hidden-import pdftools.pdfposter.cmd `
            --hidden-import pypdf `
            Gerenciador_Impressoes_Pro.py

      - name: Salvar Artefato do Windows
        uses: actions/upload-artifact@v4
        with:
          name: Gerenciador_Impressoes_Pro-Windows
          path: dist/Gerenciador_Impressoes_Pro.exe

  # =========================================================================
  # 2. BUILD LINUX (.AppImage)
  # =========================================================================
  build-linux:
    name: Compilar para Linux (.AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 wget file libfuse2

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar Binário com PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Gerenciador_Impressoes_Pro" \
            --add-data "icon.png:." \
            --hidden-import pdftools.pdfposter.cmd \
            --hidden-import pypdf \
            Gerenciador_Impressoes_Pro.py

      - name: Gerar Pacote AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          cp -r dist/Gerenciador_Impressoes_Pro/* AppDir/usr/bin/

          # Gerar ícones em todas as resoluções padrão para o KDE Plasma / BigLinux / GNOME
          python3 -c "
          from PIL import Image
          import os

          img = Image.open('icon.png')
          for sz in [16, 32, 48, 64, 128, 256, 512]:
              d = f'AppDir/usr/share/icons/hicolor/{sz}x{sz}/apps'
              os.makedirs(d, exist_ok=True)
              img.resize((sz, sz), Image.Resampling.LANCZOS).save(f'{d}/gerenciador-impressoes.png')
          "

          # Ícones na raiz do AppDir
          cp icon.png AppDir/gerenciador-impressoes.png
          cp icon.png AppDir/icon.png
          cp icon.png AppDir/.DirIcon
          
          # Criar arquivo .desktop oficial com %F e todos os tipos MIME para menu de contexto e lançador
          cat << 'EOF' > AppDir/gerenciador-impressoes.desktop
          [Desktop Entry]
          Name=Gerenciador de Impressões Pro
          GenericName=Gerenciador de Impressão
          Comment=Gerenciador Avançado de Impressão, Pré-visualização e Fila CUPS
          Exec=Gerenciador_Impressoes_Pro %F
          Icon=gerenciador-impressoes
          Terminal=false
          Type=Application
          Categories=Office;Utility;Printing;
          MimeType=application/pdf;application/vnd.oasis.opendocument.text;application/vnd.oasis.opendocument.spreadsheet;application/vnd.oasis.opendocument.presentation;application/msword;application/vnd.openxmlformats-officedocument.wordprocessingml.document;application/vnd.ms-excel;application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;application/vnd.ms-powerpoint;application/vnd.openxmlformats-officedocument.presentationml.presentation;text/plain;text/rtf;text/csv;
          StartupNotify=true
          EOF

          cp AppDir/gerenciador-impressoes.desktop AppDir/usr/share/applications/gerenciador-impressoes.desktop

          # Criar script de inicialização AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"

          # Garantir que o Python encontre os certificados CA raiz do sistema host
          for cert in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/ca-bundle.pem /etc/ssl/cert.pem; do
              if [ -f "$cert" ]; then
                  export SSL_CERT_FILE="$cert"
                  break
              fi
          done

          exec "${HERE}/usr/bin/Gerenciador_Impressoes_Pro" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Baixar e preparar appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          
          # Construir o AppImage oficial
          ARCH=x86_64 squashfs-root/AppRun AppDir Gerenciador_Impressoes_Pro-x86_64.AppImage

      - name: Salvar Artefato do Linux
        uses: actions/upload-artifact@v4
        with:
          name: Gerenciador_Impressoes_Pro-Linux
          path: Gerenciador_Impressoes_Pro-x86_64.AppImage

  # =========================================================================
  # 3. PUBLICAR RELEASE (Quando criar uma Tag, ex: v1.1.0)
  # =========================================================================
  release:
    name: Publicar Release no GitHub
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos do Windows
        uses: actions/download-artifact@v4
        with:
          name: Gerenciador_Impressoes_Pro-Windows
          path: release/

      - name: Baixar Artefatos do Linux
        uses: actions/download-artifact@v4
        with:
          name: Gerenciador_Impressoes_Pro-Linux
          path: release/

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Gerenciador_Impressoes_Pro.exe
            release/Gerenciador_Impressoes_Pro-x86_64.AppImage
          generate_release_notes: true
